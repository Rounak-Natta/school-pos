services:
  postgres:
    image: postgres:16-alpine
    container_name: school_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_pos_system
    ports:
      - "5432:5432"
    volumes:
      - school_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_pos_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  school_pos_pgdata: